services:
  postgres:
    image: postgres:17-alpine
    container_name: sosnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sosnet}
      POSTGRES_USER: ${POSTGRES_USER:-sosnet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sosnet_admin_dev}
      SOSNET_API_PASSWORD: ${SOSNET_API_PASSWORD:-sosnet_api_dev}
      SOSNET_REPORT_PASSWORD: ${SOSNET_REPORT_PASSWORD:-sosnet_reporte_dev}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" >/dev/null
          && psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM public.configuracion_central WHERE id_configuracion = 1"
          | grep -q 1
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 60

  backend:
    build: ./backend
    container_name: sosnet-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_DEBUG: ${FLASK_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-change-me-1234567890}
      JWT_ACCESS_TOKEN_HOURS: ${JWT_ACCESS_TOKEN_HOURS:-8}
      DATABASE_URL: postgresql+psycopg://sosnet_api:${SOSNET_API_PASSWORD:-sosnet_api_dev}@postgres:5432/${POSTGRES_DB:-sosnet}
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1010,http://localhost:5173}
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      SOS_RETENTION_DAYS: ${SOS_RETENTION_DAYS:-90}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
