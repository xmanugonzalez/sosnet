services:
  mysql:
    image: mysql:8.4
    container_name: sosnet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sosnet}
      MYSQL_USER: ${MYSQL_USER:-sosnet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sosnet_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

